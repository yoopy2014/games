<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Multi-Racing Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
    }
    #speedometer {
      font-size: 28px;
      color: #00ffcc;
    }
    #status-msg {
      font-size: 18px;
      color: #ffcc00;
      margin-top: 5px;
    }
    #checkpoint-msg {
      font-size: 16px;
      color: #00ff66;
    }
    #item-stock {
      font-size: 20px;
      color: #ff00ea;
      margin-top: 5px;
    }
    #drift-status {
      font-size: 22px;
      color: #00ffff;
      margin-top: 5px;
      display: none;
      text-shadow: 0 0 10px #00ffff;
    }
    #offroad-warning {
      color: #ff3333;
      font-size: 18px;
      display: none;
    }
    .top-btn {
      position: absolute;
      top: 10px;
      z-index: 30;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #555;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .top-btn:hover { background: #ff0055; }
    #admin-link { right: 10px; }
    #bgm-toggle { right: 160px; }

    /* ロビー・選択UI */
    #lobby-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .lobby-box {
      background: #222;
      padding: 25px;
      border-radius: 12px;
      border: 2px solid #555;
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    .car-select-container {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }
    .car-card {
      background: #333;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 10px;
      width: 28%;
      cursor: pointer;
      transition: all 0.2s;
    }
    .car-card:hover, .car-card.selected {
      border-color: #00ffcc;
      background: #444;
      transform: scale(1.05);
    }
    .car-card h4 { margin: 5px 0; color: #ffea00; }
    .car-card p { font-size: 11px; color: #ccc; margin: 0; }
    
    .start-btn {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 12px 30px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    .start-btn:hover { background: #ff2277; }
    .start-btn:disabled { background: #555; cursor: not-allowed; }

    #countdown {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px; font-weight: 900;
      color: #ff0055;
      text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
      display: none; z-index: 20;
    }
    #goal-banner {
      position: absolute;
      top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 72px; font-weight: 900;
      color: #ffea00;
      text-shadow: 0 0 30px #ffea00, 4px 4px 0px #000;
      display: none; text-align: center; z-index: 20;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <button id="bgm-toggle" class="top-btn" onclick="toggleBGM()">🎵 BGM: ON</button>
  <a id="admin-link" class="top-btn" href="/admin.html" target="_blank">⚙️ 管理者画面</a>

  <!-- ロビー画面 -->
  <div id="lobby-overlay">
    <div class="lobby-box">
      <h2>🚗 3D MULTI-RACING</h2>
      
      <h3>1. カートを選択</h3>
      <div class="car-select-container">
        <div class="car-card selected" onclick="selectCar('standard', this)">
          <h4>Standard</h4>
          <p>標準バランス型</p>
        </div>
        <div class="car-card" onclick="selectCar('speed', this)">
          <h4>Speed</h4>
          <p>最高速重視</p>
        </div>
        <div class="car-card" onclick="selectCar('grip', this)">
          <h4>Grip</h4>
          <p>旋回・加速重視</p>
        </div>
      </div>

      <h3>2. ゲームモード選択</h3>
      <div style="margin-bottom: 15px;">
        <label><input type="radio" name="gameMode" value="multi" checked onchange="updateModeUI()"> マルチプレイ</label>
        &nbsp;&nbsp;
        <label><input type="radio" name="gameMode" value="single" onchange="updateModeUI()"> シングル（AI対戦）</label>
      </div>

      <div id="host-notice" style="font-size: 13px; color: #ffcc00; margin-bottom: 10px;">
        ※パーティーリーダーのみスタート可能
      </div>

      <button id="btn-start-game" class="start-btn" onclick="startGame()">レーススタート</button>
    </div>
  </div>

  <audio id="bgm" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73180.mp3?filename=synthwave-80s-110045.mp3" type="audio/mpeg">
  </audio>

  <div id="ui-container">
    <div>LAP: <span id="lap-display">1</span> / 3</div>
    <div id="speedometer">0 km/h</div>
    <div id="checkpoint-msg">NEXT: 中間チェックポイントを目指せ</div>
    <div id="item-stock">ITEM: なし [Eキーで使用]</div>
    <div id="drift-status">💨 DRIFT CHARGING... [Shift]</div>
    <div id="offroad-warning">⚠️ 芝生（減速中）</div>
    <div id="status-msg">待機中...</div>
    <div id="god-mode" style="color: #ffea00; display: none;">★ GOD MODE ENABLED ★</div>
  </div>

  <div id="countdown">3</div>
  <div id="goal-banner">GOAL!!</div>

  <script>
    const socket = io();

    // BGM
    const bgm = document.getElementById('bgm');
    bgm.volume = 0.3;
    let bgmEnabled = true;

    function playBGM() {
      if (bgmEnabled && bgm.paused) bgm.play().catch(() => {});
    }

    function toggleBGM() {
      const btn = document.getElementById('bgm-toggle');
      if (bgmEnabled) {
        bgmEnabled = false; bgm.pause(); btn.innerText = "🎵 BGM: OFF";
      } else {
        bgmEnabled = true; bgm.play().catch(() => {}); btn.innerText = "🎵 BGM: ON";
      }
    }

    // 1. Scene & Setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xff7744, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffaa44, 1.2);
    dirLight.position.set(100, 150, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Sky & Ground
    const skyGeo = new THREE.SphereGeometry(500, 32, 15);
    const skyMat = new THREE.MeshBasicMaterial({ color: 0xff5533, side: THREE.BackSide });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    const groundGeo = new THREE.PlaneGeometry(1000, 1000);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x113311, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2; ground.position.y = -0.5;
    scene.add(ground);

    // Course
    const coursePoints = [
      new THREE.Vector3(0, 0, -20),
      new THREE.Vector3(0, 0, 100),
      new THREE.Vector3(120, 0, 160),
      new THREE.Vector3(180, 5, -50),
      new THREE.Vector3(80, 0, -220),
      new THREE.Vector3(-80, -5, -200),
      new THREE.Vector3(-140, 0, -80),
      new THREE.Vector3(-80, 0, -40)
    ];
    const curve = new THREE.CatmullRomCurve3(coursePoints, true);
    const trackGeo = new THREE.TubeGeometry(curve, 200, 12, 16, true);
    const trackMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8 });
    const trackMesh = new THREE.Mesh(trackGeo, trackMat);
    trackMesh.scale.y = 0.05;
    scene.add(trackMesh);

    // Trees
    function createTree(x, z) {
      const treeGroup = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3, 6), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
      trunk.position.y = 1.5; treeGroup.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 7, 6), new THREE.MeshStandardMaterial({ color: 0x1e6f28 }));
      leaves.position.y = 5.5; treeGroup.add(leaves);
      treeGroup.position.set(x, 0, z);
      scene.add(treeGroup);
    }

    for (let i = 0; i <= 150; i++) {
      const pt = curve.getPoint(i / 150);
      const tangent = curve.getTangent(i / 150);
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
      createTree(pt.x + normal.x * (18 + Math.random() * 8), pt.z + normal.z * (18 + Math.random() * 8));
      createTree(pt.x - normal.x * (18 + Math.random() * 8), pt.z - normal.z * (18 + Math.random() * 8));
    }

    // Finish Line
    function createFinishLine() {
      const group = new THREE.Group();
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,128,128);
      ctx.fillStyle = '#000000'; ctx.fillRect(0,0,64,64); ctx.fillRect(64,64,64,64);
      const checkerTex = new THREE.CanvasTexture(canvas);
      checkerTex.wrapS = checkerTex.wrapT = THREE.RepeatWrapping;
      checkerTex.repeat.set(4, 1);

      const lineMesh = new THREE.Mesh(new THREE.PlaneGeometry(24, 6), new THREE.MeshStandardMaterial({ map: checkerTex }));
      lineMesh.rotation.x = -Math.PI / 2; lineMesh.position.y = 0.02; group.add(lineMesh);

      const pillarMat = new THREE.MeshStandardMaterial({ color: 0xff0055 });
      const p1 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 1), pillarMat); p1.position.set(-12, 5, 0);
      const p2 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 1), pillarMat); p2.position.set(12, 5, 0);
      group.add(p1); group.add(p2);

      const arch = new THREE.Mesh(new THREE.BoxGeometry(25, 3, 1), new THREE.MeshStandardMaterial({ map: checkerTex }));
      arch.position.set(0, 10, 0); group.add(arch);

      group.position.set(0, 0, 40);
      scene.add(group);
    }
    createFinishLine();

    // Checkpoint
    const checkpointMesh = new THREE.Mesh(new THREE.TorusGeometry(12, 0.6, 8, 24), new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true }));
    checkpointMesh.position.set(80, 5, -220);
    scene.add(checkpointMesh);

    // Items
    const itemBoxes = [];
    [new THREE.Vector3(0, 1.5, 70), new THREE.Vector3(130, 1.5, 60), new THREE.Vector3(0, 1.5, -210), new THREE.Vector3(-120, 1.5, -70)].forEach(pos => {
      const box = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0xffea00, metalness: 0.8 }));
      box.position.copy(pos); scene.add(box);
      itemBoxes.push({ mesh: box, active: true, respawnTimer: 0 });
    });

    const bananas = [];
    function spawnBananaMesh(id, x, z) {
      const banana = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0xffff00 }));
      banana.position.set(x, 0.2, z); scene.add(banana);
      bananas.push({ id: id, mesh: banana });
    }

    const smokes = [];
    function createSmoke(x, z) {
      const smoke = new THREE.Mesh(new THREE.SphereGeometry(0.5, 6, 6), new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.6 }));
      smoke.position.set(x, 0.3, z); scene.add(smoke);
      smokes.push(smoke);
    }

    // 車両メッシュ
    function createCarMesh(colorHex, carType = 'standard') {
      const carGroup = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: parseInt(colorHex.replace('#', '0x')), metalness: 0.5, roughness: 0.2 });

      let width = 2, height = 0.8, length = 4;
      if (carType === 'speed') { length = 4.8; height = 0.6; }
      else if (carType === 'grip') { width = 2.4; length = 3.6; }

      const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, length), bodyMat);
      body.position.y = height / 2; carGroup.add(body);

      const roof = new THREE.Mesh(new THREE.BoxGeometry(width * 0.8, 0.6, length * 0.5), new THREE.MeshStandardMaterial({ color: 0x111111 }));
      roof.position.set(0, height + 0.3, -0.3); carGroup.add(roof);

      const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
      const hl2 = hl1.clone();
      hl1.position.set(-width*0.35, height*0.6, length/2 + 0.01);
      hl2.position.set(width*0.35, height*0.6, length/2 + 0.01);
      carGroup.add(hl1); carGroup.add(hl2);

      return carGroup;
    }

    // カート選択
    let selectedCarType = 'standard';
    function selectCar(type, elem) {
      selectedCarType = type;
      document.querySelectorAll('.car-card').forEach(c => c.classList.remove('selected'));
      elem.classList.add('selected');
      socket.emit('selectCar', type);
      applyCarStats(type);
    }

    function applyCarStats(type) {
      if (type === 'speed') {
        myData.maxSpeed = 1.0; myData.accel = 0.018; myData.turnSpeed = 0.032;
      } else if (type === 'grip') {
        myData.maxSpeed = 0.75; myData.accel = 0.025; myData.turnSpeed = 0.05;
      } else {
        myData.maxSpeed = 0.8; myData.accel = 0.02; myData.turnSpeed = 0.04;
      }
    }

    // プレイヤー＆AI状態
    const otherPlayers = {};
    let localPlayerMesh = null;
    let canControl = false;
    let isSinglePlayer = false;
    let aiCars = [];

    let myData = { 
      x: 0, y: 0, z: 0, rotY: 0, speed: 0,
      maxSpeed: 0.8, accel: 0.02, turnSpeed: 0.04,
      lap: 1, hasPassedCP: false, currentItem: null, spinTimer: 0, boostTimer: 0,
      isDrifting: false, driftCharge: 0, driftDir: 0
    };
    const keys = {};

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'e') useItem();
    });
    
    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
      if (e.key === 'Shift' && myData.isDrifting) {
        if (myData.driftCharge > 20) {
          myData.boostTimer = Math.min(30 + myData.driftCharge * 1.5, 90);
          myData.speed = myData.maxSpeed * 2.0;
        }
        myData.isDrifting = false; myData.driftCharge = 0;
        document.getElementById('drift-status').style.display = 'none';
      }
    });

    function useItem() {
      if (!myData.currentItem || myData.spinTimer > 0) return;
      if (myData.currentItem === 'boost') {
        myData.boostTimer = 90; myData.speed = myData.maxSpeed * 2.2;
      } else if (myData.currentItem === 'banana') {
        const backX = myData.x - Math.sin(myData.rotY) * 4;
        const backZ = myData.z - Math.cos(myData.rotY) * 4;
        socket.emit('spawn_banana', { x: backX, z: backZ });
      }
      myData.currentItem = null;
      document.getElementById('item-stock').innerText = "ITEM: なし [Eキーで使用]";
    }

    // UI制御
    function updateModeUI() {
      const mode = document.querySelector('input[name="gameMode"]:checked').value;
      const hostNotice = document.getElementById('host-notice');
      const startBtn = document.getElementById('btn-start-game');

      if (mode === 'single') {
        hostNotice.innerText = "※シングルプレイ（いつでも開始可能）";
        startBtn.disabled = false;
      } else {
        const isHost = socket.meData ? socket.meData.isHost : false;
        startBtn.disabled = !isHost;
        hostNotice.innerText = isHost ? "あなたがリーダーです（スタート可能）" : "※リーダーのスタート待機中...";
      }
    }

    function startGame() {
      const mode = document.querySelector('input[name="gameMode"]:checked').value;
      if (mode === 'single') {
        isSinglePlayer = true;
        setupSinglePlayerAI();
        startCountdownLocal();
      } else {
        isSinglePlayer = false;
        socket.emit('request_start_race'); // サーバーにスタートを要求（リーダーのみ許可される）
      }
    }

    function setupSinglePlayerAI() {
      aiCars.forEach(ai => scene.remove(ai.mesh));
      aiCars = [];

      for (let i = 0; i < 2; i++) {
        const aiMesh = createCarMesh('#ff0000', 'standard');
        scene.add(aiMesh);
        aiCars.push({
          mesh: aiMesh,
          progress: 0.05 + i * 0.02,
          speed: 0.0015 + Math.random() * 0.0005
        });
      }
    }

    function startCountdownLocal() {
      playBGM();
      let count = 3;
      canControl = false; myData.speed = 0;
      document.getElementById('lobby-overlay').style.display = 'none'; // ロビーを閉じる
      const cdElem = document.getElementById('countdown');
      cdElem.style.display = 'block'; cdElem.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) cdElem.innerText = count;
        else if (count === 0) { cdElem.innerText = "GO!!"; canControl = true; }
        else { cdElem.style.display = 'none'; clearInterval(timer); }
      }, 1000);
    }

    // Socket.io
    socket.on('updatePlayers', (players) => {
      const me = players[socket.id];
      if (me) {
        socket.meData = me;
        if (!localPlayerMesh) {
          localPlayerMesh = createCarMesh(me.color, me.carType);
          scene.add(localPlayerMesh);
        }
        updateModeUI(); // 権限UI更新
      }

      Object.keys(players).forEach(id => {
        if (id !== socket.id) {
          if (!otherPlayers[id]) {
            otherPlayers[id] = createCarMesh(players[id].color, players[id].carType);
            scene.add(otherPlayers[id]);
          }
          otherPlayers[id].position.set(players[id].x, players[id].y, players[id].z);
          otherPlayers[id].rotation.y = players[id].rotY;
        }
      });
    });

    socket.on('playerMoved', data => {
      if (otherPlayers[data.id]) {
        otherPlayers[data.id].position.set(data.x, data.y, data.z);
        otherPlayers[data.id].rotation.y = data.rotY;
      }
    });

    socket.on('playerLeft', id => {
      if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
    });

    socket.on('banana_spawned', data => spawnBananaMesh(data.id, data.x, data.z));
    socket.on('banana_removed', id => {
      const idx = bananas.findIndex(b => b.id === id);
      if (idx !== -1) { scene.remove(bananas[idx].mesh); bananas.splice(idx, 1); }
    });
    socket.on('initBananas', serverBananas => serverBananas.forEach(b => spawnBananaMesh(b.id, b.x, b.z)));

    // ★ サーバーからスタートの指示が飛んできた時だけカウントダウンが始まる
    socket.on('startCountdown', () => {
      startCountdownLocal();
    });

    // 描画ループ
    function animate() {
      requestAnimationFrame(animate);

      if (isSinglePlayer && canControl) {
        aiCars.forEach(ai => {
          ai.progress = (ai.progress + ai.speed) % 1.0;
          const pos = curve.getPoint(ai.progress);
          const tangent = curve.getTangent(ai.progress);
          ai.mesh.position.copy(pos);
          ai.mesh.rotation.y = Math.atan2(tangent.x, tangent.z);
        });
      }

      itemBoxes.forEach(b => {
        if (b.active) b.mesh.rotation.y += 0.03;
        else if (--b.respawnTimer <= 0) { b.active = true; b.mesh.visible = true; }
      });

      if (canControl && localPlayerMesh) {
        if (myData.spinTimer > 0) {
          myData.spinTimer--; myData.rotY += 0.3; myData.speed *= 0.8;
        } else {
          const myPos = new THREE.Vector3(myData.x, 0, myData.z);
          let minDist = 999;
          for (let i = 0; i <= 100; i++) {
            const d = myPos.distanceTo(curve.getPoint(i / 100));
            if (d < minDist) minDist = d;
          }

          let currentMaxSpeed = myData.maxSpeed;
          if (myData.boostTimer > 0) {
            myData.boostTimer--; currentMaxSpeed = myData.maxSpeed * 2.2;
            document.getElementById('offroad-warning').style.display = 'none';
          } else if (minDist > 14) {
            currentMaxSpeed = myData.maxSpeed * 0.35;
            document.getElementById('offroad-warning').style.display = 'block';
          } else {
            document.getElementById('offroad-warning').style.display = 'none';
          }

          if (keys['w'] || keys['arrowup']) myData.speed = Math.min(myData.speed + myData.accel * 2, currentMaxSpeed);
          else if (keys['s'] || keys['arrowdown']) myData.speed = Math.max(myData.speed - myData.accel, -currentMaxSpeed * 0.4);
          else if (myData.boostTimer <= 0) myData.speed *= 0.96;

          const isSteeringLeft = keys['a'] || keys['arrowleft'];
          const isSteeringRight = keys['d'] || keys['arrowright'];

          if (keys['shift'] && (isSteeringLeft || isSteeringRight) && Math.abs(myData.speed) > 0.3) {
            myData.isDrifting = true; myData.driftDir = isSteeringLeft ? 1 : -1; myData.driftCharge++;
            document.getElementById('drift-status').style.display = 'block';
            createSmoke(myData.x, myData.z);
          }

          const turnMult = myData.isDrifting ? 1.6 : 1.0;
          if (isSteeringLeft) myData.rotY += myData.turnSpeed * (myData.speed / myData.maxSpeed) * turnMult;
          if (isSteeringRight) myData.rotY -= myData.turnSpeed * (myData.speed / myData.maxSpeed) * turnMult;
        }

        myData.x += Math.sin(myData.rotY) * myData.speed;
        myData.z += Math.cos(myData.rotY) * myData.speed;

        localPlayerMesh.position.set(myData.x, myData.y, myData.z);
        localPlayerMesh.rotation.y = myData.rotY + (myData.isDrifting ? myData.driftDir * 0.3 : 0);

        itemBoxes.forEach(b => {
          if (b.active && Math.hypot(myData.x - b.mesh.position.x, myData.z - b.mesh.position.z) < 3.5) {
            b.active = false; b.mesh.visible = false; b.respawnTimer = 300;
            if (!myData.currentItem) {
              const items = ['boost', 'banana'];
              myData.currentItem = items[Math.floor(Math.random() * items.length)];
              document.getElementById('item-stock').innerText = `ITEM: ${myData.currentItem === 'boost' ? '🚀 ダッシュ' : '🍌 バナナ'} [Eキーで使用]`;
            }
          }
        });

        bananas.forEach(b => {
          if (Math.hypot(myData.x - b.mesh.position.x, myData.z - b.mesh.position.z) < 2.2) {
            myData.spinTimer = 30; socket.emit('remove_banana', b.id);
          }
        });

        if (Math.hypot(myData.x - 80, myData.z - (-220)) < 25 && !myData.hasPassedCP) {
          myData.hasPassedCP = true;
          document.getElementById('checkpoint-msg').innerText = "OK! ゴールを目指せ！";
        }

        if (myData.hasPassedCP && Math.abs(myData.x) < 12 && Math.abs(myData.z - 40) < 4) {
          myData.hasPassedCP = false; myData.lap++;
          document.getElementById('lap-display').innerText = Math.min(myData.lap, 3);
          document.getElementById('checkpoint-msg').innerText = "NEXT: 中間チェックポイントを目指せ";
          if (myData.lap > 3) { canControl = false; document.getElementById('goal-banner').style.display = 'block'; }
        }

        if (!isSinglePlayer) {
          socket.emit('playerTransform', { x: myData.x, y: myData.y, z: myData.z, rotY: myData.rotY });
        }
        document.getElementById('speedometer').innerText = `${Math.round(Math.abs(myData.speed) * 180)} km/h`;
      }

      smokes.forEach((s, idx) => {
        s.position.y += 0.05; s.material.opacity -= 0.03;
        if (s.material.opacity <= 0) { scene.remove(s); smokes.splice(idx, 1); }
      });

      if (localPlayerMesh) {
        const camOffset = new THREE.Vector3(0, 4, -12).applyAxisAngle(new THREE.Vector3(0, 1, 0), myData.rotY);
        camera.position.copy(localPlayerMesh.position).add(camOffset);
        camera.lookAt(localPlayerMesh.position.clone().add(new THREE.Vector3(0, 1.5, 10).applyAxisAngle(new THREE.Vector3(0, 1, 0), myData.rotY)));
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
