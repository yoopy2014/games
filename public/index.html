<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Multi-Racing Game - 10 Courses</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      top: 45px;
      left: 10px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
    }
    #fps-display {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #00ffcc;
      font-size: 20px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #00ffcc;
      z-index: 50;
      pointer-events: none;
    }
    #rank-display { font-size: 42px; color: #ffea00; font-weight: 900; text-shadow: 0 0 10px #ffea00, 2px 2px 4px #000; }
    #speedometer { font-size: 28px; color: #00ffcc; }
    #status-msg { font-size: 18px; color: #ffcc00; margin-top: 5px; }
    #checkpoint-msg { font-size: 16px; color: #00ff66; }
    #item-stock { font-size: 20px; color: #ff00ea; margin-top: 5px; }
    #drift-status { font-size: 22px; color: #00ffff; margin-top: 5px; display: none; text-shadow: 0 0 10px #00ffff; }
    #offroad-warning { color: #ff3333; font-size: 18px; display: none; }
    #god-mode-msg { color: #ffea00; font-size: 22px; display: none; text-shadow: 0 0 12px #ffea00; animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
    
    .top-btn {
      position: absolute;
      top: 10px;
      z-index: 30;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #555;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .top-btn:hover { background: #ff0055; }
    #admin-link { right: 10px; }
    #bgm-toggle { right: 160px; }

    /* ロビー UI */
    #lobby-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .lobby-box {
      background: #222;
      padding: 25px;
      border-radius: 12px;
      border: 2px solid #555;
      text-align: center;
      max-width: 520px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .input-field {
      width: 80%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #555;
      background: #333;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }
    .select-field {
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1px solid #555;
      background: #333;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .car-select-container {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
    }
    .car-card {
      background: #333;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 10px;
      width: 28%;
      cursor: pointer;
      transition: all 0.2s;
    }
    .car-card:hover, .car-card.selected {
      border-color: #00ffcc;
      background: #444;
      transform: scale(1.05);
    }
    .car-card h4 { margin: 5px 0; color: #ffea00; }
    .car-card p { font-size: 11px; color: #ccc; margin: 0; }
    
    .btn-action {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    .btn-action:hover { background: #ff2277; }
    .btn-secondary { background: #4444ff; }
    .btn-secondary:hover { background: #6666ff; }
    .btn-action:disabled { background: #555; cursor: not-allowed; }

    .player-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #333;
      padding: 6px 12px;
      margin-top: 5px;
      border-radius: 4px;
      font-size: 14px;
    }
    .btn-kick {
      background: #ff3333;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    #qrcode-container {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      display: inline-block;
      margin: 10px 0;
    }

    #countdown {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px; font-weight: 900;
      color: #ff0055;
      text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
      display: none; z-index: 20;
    }
    #goal-banner {
      position: absolute;
      top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 64px; font-weight: 900;
      color: #ffea00;
      text-shadow: 0 0 30px #ffea00, 4px 4px 0px #000;
      display: none; text-align: center; z-index: 20;
    }

    .nametag {
      position: absolute;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #00ffcc;
      padding: 3px 8px;
      border-radius: 6px;
      pointer-events: none;
      transform: translate(-50%, -100%);
      white-space: nowrap;
      z-index: 5;
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="fps-display">FPS: --</div>

  <button id="bgm-toggle" class="top-btn" onclick="toggleBGM()">🎵 BGM: ON</button>
  <a id="admin-link" class="top-btn" href="/admin.html" target="_blank">⚙️ 管理者画面</a>

  <div id="nametag-container"></div>

  <!-- ロビー画面 -->
  <div id="lobby-overlay">
    <div class="lobby-box">
      <h2>🚗 3D MULTI-RACING</h2>
      
      <div>
        <label style="font-size: 14px; font-weight: bold;">プレイヤー名:</label><br>
        <input type="text" id="player-name" class="input-field" value="レーサー" maxlength="10">
      </div>

      <!-- コース選択 -->
      <div style="margin-top: 10px;">
        <label style="font-size: 14px; font-weight: bold; color: #00ffcc;">🏁 コース選択: </label>
        <select id="course-select" class="select-field" onchange="changeCourse(this.value)">
          <option value="0">1. クラシックサーキット (標準)</option>
          <option value="1">2. エイトクロス (8の字)</option>
          <option value="2">3. 爆速ハイウェイ (超高速)</option>
          <option value="3">4. スネークツイスター (S字テクニカル)</option>
          <option value="4">5. ビッグマウンテン (超大型)</option>
          <option value="5">6. スターリング (星型コース)</option>
          <option value="6">7. ジグザグアリーナ (ヘアピン連発)</option>
          <option value="7">8. 首都高スタイル (急カーブ多重)</option>
          <option value="8">9. ダブルループ (二重環状)</option>
          <option value="9">10. ハイパーコースト (特大外周)</option>
        </select>
      </div>

      <h3>カート選択</h3>
      <div class="car-select-container">
        <div class="car-card selected" onclick="selectCar('standard', this)">
          <h4>Standard</h4>
          <p>標準型</p>
        </div>
        <div class="car-card" onclick="selectCar('speed', this)">
          <h4>Speed</h4>
          <p>最高速重視</p>
        </div>
        <div class="car-card" onclick="selectCar('grip', this)">
          <h4>Grip</h4>
          <p>加速・旋回</p>
        </div>
      </div>

      <div id="room-select-area">
        <button class="btn-action btn-secondary" onclick="createRoom()">パーティーを作成する</button>
        <div style="margin: 10px 0;">または</div>
        <input type="text" id="join-code" class="input-field" placeholder="4桁コード入力" style="width: 120px; text-transform: uppercase;">
        <button class="btn-action" onclick="joinRoom()">部屋に入る</button>
        <hr style="border: 0.5px solid #444; margin: 15px 0;">
        
        <div style="margin-bottom: 8px;">
          <label style="font-size: 13px; font-weight: bold; color: #ffea00;">NPC強さ: </label>
          <select id="ai-difficulty" class="select-field">
            <option value="easy">ふつう (Easy)</option>
            <option value="normal" selected>つよい (Normal)</option>
            <option value="hard">激ムズ (Hard)</option>
          </select>
        </div>
        <button class="btn-action" style="background:#555;" onclick="startSinglePlayer()">シングルプレイ（AI対戦）</button>
      </div>

      <div id="room-lobby-area" style="display: none;">
        <h3>ROOM CODE: <span id="display-room-code" style="color:#00ffcc; font-size:24px;">----</span></h3>
        
        <div>
          <div style="font-size: 12px; color: #aaa; margin-bottom: 4px;">スマホでカメラから読み取って参加</div>
          <div id="qrcode-container"></div>
        </div>

        <button class="btn-action btn-secondary" style="font-size: 12px; padding: 4px 10px;" onclick="copyInviteLink()">📋 招待リンクをコピー</button>
        
        <div style="text-align: left; margin-top: 15px;">
          <div style="font-size: 14px; font-weight: bold;">参加メンバー:</div>
          <div id="member-list" style="max-height: 120px; overflow-y: auto; margin-top: 5px;"></div>
        </div>

        <div id="host-notice" style="font-size: 13px; color: #ffcc00; margin: 15px 0 5px 0;"></div>
        <button id="btn-start-race" class="btn-action" style="width: 100%; font-size: 20px;" onclick="requestStartRace()">レーススタート</button>
      </div>

    </div>
  </div>

  <audio id="bgm" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73180.mp3?filename=synthwave-80s-110045.mp3" type="audio/mpeg">
  </audio>

  <div id="ui-container">
    <div id="rank-display">1st <span style="font-size: 20px; color: #bbb;">/ 3</span></div>
    <div>LAP: <span id="lap-display">1</span> / 3</div>
    <div id="speedometer">0 km/h</div>
    <div id="checkpoint-msg">NEXT: 中間チェックポイントを目指せ</div>
    <div id="item-stock">ITEM: なし [Eキーで使用]</div>
    <div id="drift-status">💨 DRIFT CHARGING... [Shift]</div>
    <div id="offroad-warning">⚠️ ガードレール衝突中！</div>
    <div id="god-mode-msg">★ GOD MODE ENABLED ★</div>
    <div id="status-msg">待機中...</div>
  </div>

  <div id="countdown">3</div>
  <div id="goal-banner">GOAL!!<br><span id="final-rank" style="font-size: 36px; color: #ffffff;"></span></div>

  <script>
    const socket = io();

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        document.getElementById('join-code').value = roomParam.toUpperCase();
      }
    });

    const bgm = document.getElementById('bgm');
    bgm.volume = 0.3;
    let bgmEnabled = true;

    function playBGM() {
      if (bgmEnabled && bgm.paused) bgm.play().catch(() => {});
    }

    function toggleBGM() {
      const btn = document.getElementById('bgm-toggle');
      if (bgmEnabled) { bgmEnabled = false; bgm.pause(); btn.innerText = "🎵 BGM: OFF"; }
      else { bgmEnabled = true; bgm.play().catch(() => {}); btn.innerText = "🎵 BGM: ON"; }
    }

    let frameCount = 0;
    let lastTime = performance.now();
    const fpsElem = document.getElementById('fps-display');

    // 1. Three.js セットアップ
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xff6633, 0.0025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, -15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffddbb, 0.7); 
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffaa55, 1.8);
    dirLight.position.set(120, 180, 80);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 600;
    const d = 250;
    dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    const skyGeo = new THREE.SphereGeometry(500, 32, 15);
    scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ color: 0xff4411, side: THREE.BackSide })));

    const groundMat = new THREE.MeshStandardMaterial({ color: 0x183a18, roughness: 0.9, metalness: 0.1 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), groundMat);
    ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // ★ 10種類のコースデータ定義
    const coursePresets = [
      // 1. クラシック
      [new THREE.Vector3(0, 0, -20), new THREE.Vector3(0, 0, 100), new THREE.Vector3(120, 0, 160), new THREE.Vector3(180, 5, -50), new THREE.Vector3(80, 0, -220), new THREE.Vector3(-80, -5, -200), new THREE.Vector3(-140, 0, -80), new THREE.Vector3(-80, 0, -40)],
      // 2. 8の字
      [new THREE.Vector3(0, 0, 0), new THREE.Vector3(100, 0, 100), new THREE.Vector3(200, 0, 0), new THREE.Vector3(100, 0, -100), new THREE.Vector3(0, 0, 0), new THREE.Vector3(-100, 0, 100), new THREE.Vector3(-200, 0, 0), new THREE.Vector3(-100, 0, -100)],
      // 3. 爆速ハイウェイ
      [new THREE.Vector3(0, 0, -50), new THREE.Vector3(0, 0, 250), new THREE.Vector3(60, 0, 280), new THREE.Vector3(120, 0, 250), new THREE.Vector3(120, 0, -50), new THREE.Vector3(60, 0, -80)],
      // 4. スネークツイスター
      [new THREE.Vector3(0, 0, 0), new THREE.Vector3(80, 0, 60), new THREE.Vector3(-80, 0, 120), new THREE.Vector3(80, 0, 180), new THREE.Vector3(-80, 0, 240), new THREE.Vector3(0, 0, 300), new THREE.Vector3(150, 0, 150), new THREE.Vector3(0, 0, -50)],
      // 5. ビッグマウンテン
      [new THREE.Vector3(0, 0, 0), new THREE.Vector3(150, 10, 150), new THREE.Vector3(300, 20, 0), new THREE.Vector3(150, 10, -150), new THREE.Vector3(0, 0, -300), new THREE.Vector3(-150, -10, -150), new THREE.Vector3(-300, -20, 0), new THREE.Vector3(-150, -10, 150)],
      // 6. スターリング
      [new THREE.Vector3(0, 0, 150), new THREE.Vector3(40, 0, 40), new THREE.Vector3(150, 0, 0), new THREE.Vector3(40, 0, -40), new THREE.Vector3(0, 0, -150), new THREE.Vector3(-40, 0, -40), new THREE.Vector3(-150, 0, 0), new THREE.Vector3(-40, 0, 40)],
      // 7. ジグザグアリーナ
      [new THREE.Vector3(0, 0, -30), new THREE.Vector3(0, 0, 80), new THREE.Vector3(100, 0, 80), new THREE.Vector3(100, 0, 160), new THREE.Vector3(-100, 0, 160), new THREE.Vector3(-100, 0, -50)],
      // 8. 首都高スタイル
      [new THREE.Vector3(0, 0, 0), new THREE.Vector3(50, 0, 120), new THREE.Vector3(160, 0, 80), new THREE.Vector3(100, 0, -60), new THREE.Vector3(-40, 0, -120), new THREE.Vector3(-140, 0, -40)],
      // 9. ダブルループ
      [new THREE.Vector3(0, 0, -20), new THREE.Vector3(0, 0, 120), new THREE.Vector3(120, 0, 120), new THREE.Vector3(120, 0, -20), new THREE.Vector3(60, 0, 40), new THREE.Vector3(-60, 0, 40)],
      // 10. ハイパーコースト
      [new THREE.Vector3(0, 0, -100), new THREE.Vector3(200, 0, -100), new THREE.Vector3(250, 0, 100), new THREE.Vector3(100, 0, 250), new THREE.Vector3(-100, 0, 250), new THREE.Vector3(-250, 0, 100), new THREE.Vector3(-200, 0, -100)]
    ];

    let currentCourseIndex = 0;
    let curve = new THREE.CatmullRomCurve3(coursePresets[0], true);
    let trackMesh = null;
    let guardrailGroup = new THREE.Group();
    let treeGroup = new THREE.Group();
    let finishLineGroup = new THREE.Group();
    let checkpointMesh = null;
    const trackRadius = 11.5;

    scene.add(guardrailGroup);
    scene.add(treeGroup);
    scene.add(finishLineGroup);

    const trackMat = new THREE.MeshStandardMaterial({ color: 0x222228, roughness: 0.5, metalness: 0.2 });

    function buildCourse(index) {
      currentCourseIndex = index;
      curve = new THREE.CatmullRomCurve3(coursePresets[index], true);

      // メッシュの削除
      if (trackMesh) scene.remove(trackMesh);
      while(guardrailGroup.children.length > 0) guardrailGroup.remove(guardrailGroup.children[0]);
      while(treeGroup.children.length > 0) treeGroup.remove(treeGroup.children[0]);
      while(finishLineGroup.children.length > 0) finishLineGroup.remove(finishLineGroup.children[0]);
      if (checkpointMesh) scene.remove(checkpointMesh);

      // トラック生成
      trackMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 300, 12, 16, true), trackMat);
      trackMesh.scale.y = 0.05;
      trackMesh.receiveShadow = true;
      scene.add(trackMesh);

      // ガードレール生成
      const railSegments = 300;
      const railMat = new THREE.MeshStandardMaterial({ color: 0xee2222, metalness: 0.6, roughness: 0.3 });
      const postMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });

      for (let side = -1; side <= 1; side += 2) {
        for (let i = 0; i < railSegments; i++) {
          const t1 = i / railSegments;
          const t2 = (i + 1) / railSegments;

          const p1 = curve.getPoint(t1);
          const p2 = curve.getPoint(t2);

          const tan1 = curve.getTangent(t1).normalize();
          const tan2 = curve.getTangent(t2).normalize();

          const norm1 = new THREE.Vector3(-tan1.z, 0, tan1.x).normalize();
          const norm2 = new THREE.Vector3(-tan2.z, 0, tan2.x).normalize();

          const pos1 = p1.clone().add(norm1.clone().multiplyScalar(side * trackRadius));
          const pos2 = p2.clone().add(norm2.clone().multiplyScalar(side * trackRadius));
          pos1.y *= 0.05; pos2.y *= 0.05;

          const dist = pos1.distanceTo(pos2);
          const railMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, dist + 0.1), railMat);

          const midPos = pos1.clone().add(pos2).multiplyScalar(0.5);
          midPos.y += 0.6;
          railMesh.position.copy(midPos);

          const dir = pos2.clone().sub(pos1);
          railMesh.rotation.y = Math.atan2(dir.x, dir.z);
          guardrailGroup.add(railMesh);

          if (i % 3 === 0) {
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.2, 8), postMat);
            post.position.copy(pos1); post.position.y += 0.6;
            guardrailGroup.add(post);
          }
        }
      }

      // 木々生成
      for (let i = 0; i <= 150; i++) {
        const pt = curve.getPoint(i / 150);
        const tangent = curve.getTangent(i / 150);
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
        createTreeMesh(pt.x + normal.x * (18 + Math.random() * 8), pt.z + normal.z * (18 + Math.random() * 8));
        createTreeMesh(pt.x - normal.x * (18 + Math.random() * 8), pt.z - normal.z * (18 + Math.random() * 8));
      }

      // ★ ゴールゲート・ゴールラインの確実な生成
      const startPt = curve.getPoint(0.01);
      const tangent = curve.getTangent(0.01).normalize();
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      const lineMesh = new THREE.Mesh(new THREE.PlaneGeometry(24, 6), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }));
      lineMesh.rotation.x = -Math.PI / 2;
      lineMesh.position.y = 0.02;
      finishLineGroup.add(lineMesh);

      const pillarMat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.5, roughness: 0.3 });
      const p1 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 1), pillarMat);
      p1.position.set(-normal.x * 12, 5, -normal.z * 12);
      const p2 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 1), pillarMat);
      p2.position.set(normal.x * 12, 5, normal.z * 12);
      finishLineGroup.add(p1);
      finishLineGroup.add(p2);

      const arch = new THREE.Mesh(new THREE.BoxGeometry(25, 2, 1), pillarMat);
      arch.position.set(0, 10, 0);
      finishLineGroup.add(arch);

      finishLineGroup.position.copy(startPt);
      finishLineGroup.rotation.y = Math.atan2(tangent.x, tangent.z);

      // 中間チェックポイント (コースの50%地点)
      const midPt = curve.getPoint(0.5);
      checkpointMesh = new THREE.Mesh(new THREE.TorusGeometry(12, 0.6, 8, 24), new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true }));
      checkpointMesh.position.copy(midPt);
      checkpointMesh.position.y += 5;
      scene.add(checkpointMesh);

      // アイテムボックス配置
      itemBoxes.length = 0;
      [0.25, 0.5, 0.75].forEach(t => {
        const pt = curve.getPoint(t);
        const box = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0xffea00, metalness: 0.9, roughness: 0.1 }));
        box.position.set(pt.x, 1.5, pt.z);
        scene.add(box);
        itemBoxes.push({ mesh: box, active: true, respawnTimer: 0 });
      });
    }

    function createTreeMesh(x, z) {
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2e18, roughness: 0.9 });
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3, 6), trunkMat);
      trunk.position.set(x, 1.5, z); treeGroup.add(trunk);

      const leafMat = new THREE.MeshStandardMaterial({ color: 0x1d5e23, roughness: 0.8 });
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(3.2, 7, 6), leafMat);
      leaves.position.set(x, 5.5, z); treeGroup.add(leaves);
    }

    const itemBoxes = [];
    buildCourse(0); // 初期コースビルド

    function changeCourse(idx) {
      buildCourse(parseInt(idx));
    }

    const bananas = [];
    function spawnBananaMesh(id, x, z) {
      const banana = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0xffff00, roughness: 0.3 }));
      banana.position.set(x, 0.2, z); banana.castShadow = true; scene.add(banana);
      bananas.push({ id: id, mesh: banana });
    }

    const smokes = [];
    function createSmoke(x, z) {
      const smoke = new THREE.Mesh(new THREE.SphereGeometry(0.5, 6, 6), new THREE.MeshBasicMaterial({ color: 0xeeeeee, transparent: true, opacity: 0.7 }));
      smoke.position.set(x, 0.3, z); scene.add(smoke);
      smokes.push(smoke);
    }

    function createCarMesh(colorHex, carType = 'standard') {
      const carGroup = new THREE.Group();
      
      const paintMat = new THREE.MeshStandardMaterial({ color: parseInt(colorHex.replace('#', '0x')), metalness: 0.85, roughness: 0.15 });
      const carbonMat = new THREE.MeshStandardMaterial({ color: 0x111115, metalness: 0.4, roughness: 0.3 });
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.9, roughness: 0.05, transparent: true, opacity: 0.85 });
      const chromeMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.95, roughness: 0.05 });
      const brakeMat = new THREE.MeshStandardMaterial({ color: 0xff1111, metalness: 0.5, roughness: 0.2 });
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.85 });

      let width = 2.2, height = 0.75, length = 4.2;
      if (carType === 'speed') { length = 4.8; height = 0.65; }
      else if (carType === 'grip') { width = 2.4; length = 3.8; }

      const wheelRadius = 0.42;

      const chassis = new THREE.Mesh(new THREE.BoxGeometry(width * 0.9, 0.3, length), carbonMat);
      chassis.position.y = wheelRadius + 0.15; carGroup.add(chassis);

      const body = new THREE.Mesh(new THREE.BoxGeometry(width * 0.8, height * 0.6, length * 0.75), paintMat);
      body.position.set(0, wheelRadius + height * 0.4, -0.1); carGroup.add(body);

      const frontWing = new THREE.Mesh(new THREE.BoxGeometry(width * 1.1, 0.12, 0.8), paintMat);
      frontWing.position.set(0, wheelRadius + 0.06, length / 2 + 0.1); carGroup.add(frontWing);

      const cockpit = new THREE.Mesh(new THREE.BoxGeometry(width * 0.6, height * 0.6, length * 0.35), glassMat);
      cockpit.position.set(0, wheelRadius + height + 0.05, -0.2); carGroup.add(cockpit);

      const seat = new THREE.Mesh(new THREE.BoxGeometry(width * 0.5, 0.6, 0.6), carbonMat);
      seat.position.set(0, wheelRadius + height * 0.5, -0.3); seat.rotation.x = -0.2; carGroup.add(seat);

      const wingMat = (carType === 'speed') ? paintMat : carbonMat;
      const wingMain = new THREE.Mesh(new THREE.BoxGeometry(width * 1.15, 0.08, 0.6), wingMat);
      wingMain.position.set(0, wheelRadius + height + 0.6, -length / 2 + 0.2); carGroup.add(wingMain);

      const wingPillar1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.3), carbonMat);
      const wingPillar2 = wingPillar1.clone();
      wingPillar1.position.set(-width * 0.35, wheelRadius + height + 0.3, -length / 2 + 0.2);
      wingPillar2.position.set(width * 0.35, wheelRadius + height + 0.3, -length / 2 + 0.2);
      carGroup.add(wingPillar1); carGroup.add(wingPillar2);

      const muffler = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.5, 12), chromeMat);
      muffler.rotation.x = Math.PI / 2;
      muffler.position.set(0, wheelRadius + 0.2, -length / 2 - 0.05); carGroup.add(muffler);

      const wheelWidth = 0.35;
      const wheelPositions = [
        [-width / 2 - 0.08, wheelRadius, length * 0.32],
        [width / 2 + 0.08, wheelRadius, length * 0.32],
        [-width / 2 - 0.08, wheelRadius, -length * 0.32],
        [width / 2 + 0.08, wheelRadius, -length * 0.32]
      ];

      wheelPositions.forEach((pos) => {
        const wheelGroup = new THREE.Group();
        const tire = new THREE.Mesh(new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelWidth, 24), tireMat);
        tire.rotation.z = Math.PI / 2; wheelGroup.add(tire);
        const rim = new THREE.Mesh(new THREE.CylinderGeometry(wheelRadius * 0.65, wheelRadius * 0.65, wheelWidth + 0.02, 16), chromeMat);
        rim.rotation.z = Math.PI / 2; wheelGroup.add(rim);
        wheelGroup.position.set(...pos); carGroup.add(wheelGroup);
      });

      return carGroup;
    }

    // --- ロビー＆パーティー関連処理 ---
    let selectedCarType = 'standard';
    let currentRoomCode = null;
    let isHostPlayer = false;

    function selectCar(type, elem) {
      selectedCarType = type;
      document.querySelectorAll('.car-card').forEach(c => c.classList.remove('selected'));
      elem.classList.add('selected');
      socket.emit('selectCar', type);
      applyCarStats(type);
    }

    function applyCarStats(type) {
      if (type === 'speed') { myData.maxSpeed = 1.0; myData.accel = 0.018; myData.turnSpeed = 0.032; }
      else if (type === 'grip') { myData.maxSpeed = 0.75; myData.accel = 0.025; myData.turnSpeed = 0.05; }
      else { myData.maxSpeed = 0.8; myData.accel = 0.02; myData.turnSpeed = 0.04; }
    }

    function getNameInput() {
      return document.getElementById('player-name').value.trim() || 'ゲスト';
    }

    function createRoom() {
      socket.emit('create_room', { name: getNameInput(), carType: selectedCarType });
    }

    function joinRoom() {
      const code = document.getElementById('join-code').value.trim();
      if (!code) return alert('ルームコードを入力してください');
      socket.emit('join_room', { roomCode: code, name: getNameInput(), carType: selectedCarType });
    }

    function generateQRCode(roomCode) {
      const qrContainer = document.getElementById('qrcode-container');
      qrContainer.innerHTML = '';
      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
      new QRCode(qrContainer, { text: joinUrl, width: 128, height: 128 });
    }

    function copyInviteLink() {
      if (currentRoomCode) {
        const joinUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoomCode}`;
        navigator.clipboard.writeText(joinUrl);
        alert(`参加用URLをコピーしました！\n${joinUrl}`);
      }
    }

    function kickPlayer(targetId) {
      socket.emit('kick_player', targetId);
    }

    function requestStartRace() {
      socket.emit('request_start_race');
    }

    // プレイヤー状態
    const otherPlayers = {};
    const nametags = {};
    let localPlayerMesh = null;
    let canControl = false;
    let isSinglePlayer = false;
    let aiCars = [];
    let isGodMode = false;

    let myData = { 
      x: 0, y: 0.0, z: 0, rotY: 0, speed: 0,
      maxSpeed: 0.8, accel: 0.02, turnSpeed: 0.04,
      lap: 1, hasPassedCP: false, currentItem: null, spinTimer: 0, boostTimer: 0,
      isDrifting: false, driftCharge: 0, driftDir: 0,
      trackProgress: 0
    };
    const keys = {};

    const konamiCode = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
    let konamiIndex = 0;

    window.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      keys[key] = true;

      if (key === konamiCode[konamiIndex]) {
        konamiIndex++;
        if (konamiIndex === konamiCode.length) {
          isGodMode = !isGodMode;
          document.getElementById('god-mode-msg').style.display = isGodMode ? 'block' : 'none';
          konamiIndex = 0;
        }
      } else {
        konamiIndex = 0;
      }

      if (key === 'e') useItem();
    });
    
    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
      if (e.key === 'Shift' && myData.isDrifting) {
        if (myData.driftCharge > 20) {
          myData.boostTimer = Math.min(30 + myData.driftCharge * 1.5, 90);
          myData.speed = myData.maxSpeed * 2.0;
        }
        myData.isDrifting = false; myData.driftCharge = 0;
        document.getElementById('drift-status').style.display = 'none';
      }
    });

    function useItem() {
      if (!myData.currentItem || myData.spinTimer > 0) return;
      if (myData.currentItem === 'boost') {
        myData.boostTimer = 90; myData.speed = myData.maxSpeed * 2.2;
      } else if (myData.currentItem === 'banana') {
        const backX = myData.x - Math.sin(myData.rotY) * 4;
        const backZ = myData.z - Math.cos(myData.rotY) * 4;
        socket.emit('spawn_banana', { x: backX, z: backZ });
      }
      myData.currentItem = null;
      document.getElementById('item-stock').innerText = "ITEM: なし [Eキーで使用]";
    }

    function ensureLocalCarExists() {
      if (!localPlayerMesh) {
        localPlayerMesh = createCarMesh('#00ffcc', selectedCarType);
        scene.add(localPlayerMesh);
      }
      // コースのスタート地点と向きにセット
      const startPt = curve.getPoint(0.01);
      const tangent = curve.getTangent(0.01).normalize();
      myData.x = startPt.x;
      myData.z = startPt.z;
      myData.rotY = Math.atan2(tangent.x, tangent.z);
    }

    function startSinglePlayer() {
      isSinglePlayer = true;
      document.getElementById('lobby-overlay').style.display = 'none';
      ensureLocalCarExists();
      setupSinglePlayerAI();
      startCountdownLocal();
    }

    function setupSinglePlayerAI() {
      aiCars.forEach(ai => scene.remove(ai.mesh));
      aiCars = [];
      const aiColors = ['#ff2222', '#3388ff'];
      const offsets = [-3.5, 3.5];

      const diff = document.getElementById('ai-difficulty').value;
      let baseSpeed = (diff === 'easy') ? 0.00020 : (diff === 'normal') ? 0.00030 : 0.00052;
      let laneScale = (diff === 'easy') ? 1.2 : (diff === 'normal') ? 0.9 : 0.3;

      for (let i = 0; i < 2; i++) {
        const aiMesh = createCarMesh(aiColors[i], 'standard');
        scene.add(aiMesh);
        aiCars.push({ 
          mesh: aiMesh, 
          progress: 0.01 + i * 0.015,
          lap: 1,
          laneOffset: offsets[i] * laneScale,
          speed: baseSpeed + Math.random() * 0.00003
        });
      }
    }

    function startCountdownLocal() {
      playBGM();
      ensureLocalCarExists();
      let count = 3;
      canControl = false; myData.speed = 0;
      document.getElementById('lobby-overlay').style.display = 'none';
      const cdElem = document.getElementById('countdown');
      cdElem.style.display = 'block'; cdElem.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) cdElem.innerText = count;
        else if (count === 0) { cdElem.innerText = "GO!!"; canControl = true; }
        else { cdElem.style.display = 'none'; clearInterval(timer); }
      }, 1000);
    }

    // --- Socket.io 受信イベント ---
    socket.on('error_msg', msg => alert(msg));

    socket.on('room_joined', data => {
      currentRoomCode = data.roomCode;
      isHostPlayer = data.isHost;

      document.getElementById('room-select-area').style.display = 'none';
      document.getElementById('room-lobby-area').style.display = 'block';
      document.getElementById('display-room-code').innerText = data.roomCode;

      generateQRCode(data.roomCode);
    });

    socket.on('update_room_players', players => {
      const me = players[socket.id];
      if (me) {
        isHostPlayer = me.isHost;
        if (!localPlayerMesh) {
          localPlayerMesh = createCarMesh(me.color, me.carType);
          scene.add(localPlayerMesh);
        }
      }

      const memberContainer = document.getElementById('member-list');
      memberContainer.innerHTML = '';

      Object.keys(players).forEach(id => {
        const p = players[id];
        const row = document.createElement('div');
        row.className = 'player-list-item';

        const isMe = id === socket.id ? ' (自分)' : '';
        const hostBadge = p.isHost ? ' 👑' : '';

        let kickBtnHTML = '';
        if (isHostPlayer && id !== socket.id) {
          kickBtnHTML = `<button class="btn-kick" onclick="kickPlayer('${id}')">キック</button>`;
        }

        row.innerHTML = `<div><span style="color:${p.color}">■</span> ${p.name}${hostBadge}${isMe}</div>${kickBtnHTML}`;
        memberContainer.appendChild(row);

        if (id !== socket.id) {
          if (!otherPlayers[id]) {
            otherPlayers[id] = createCarMesh(p.color, p.carType);
            scene.add(otherPlayers[id]);

            const tag = document.createElement('div');
            tag.className = 'nametag';
            tag.innerText = p.name;
            document.getElementById('nametag-container').appendChild(tag);
            nametags[id] = tag;
          }
        }
      });

      const startBtn = document.getElementById('btn-start-race');
      const notice = document.getElementById('host-notice');
      if (isHostPlayer) {
        startBtn.disabled = false;
        notice.innerText = "あなたがパーティーリーダーです（スタート可能）";
      } else {
        startBtn.disabled = true;
        notice.innerText = "※リーダーのスタート待機中...";
      }
    });

    socket.on('playerMoved', data => {
      if (otherPlayers[data.id]) {
        otherPlayers[data.id].position.set(data.x, data.y, data.z);
        otherPlayers[data.id].rotation.y = data.rotY;
      }
    });

    socket.on('playerLeft', id => {
      if (otherPlayers[id]) {
        scene.remove(otherPlayers[id]); delete otherPlayers[id];
        if (nametags[id]) { nametags[id].remove(); delete nametags[id]; }
      }
    });

    socket.on('kicked', () => {
      alert('パーティーリーダーによってキック（追放）されました。');
      location.reload();
    });

    socket.on('banana_spawned', data => spawnBananaMesh(data.id, data.x, data.z));
    socket.on('banana_removed', id => {
      const idx = bananas.findIndex(b => b.id === id);
      if (idx !== -1) { scene.remove(bananas[idx].mesh); bananas.splice(idx, 1); }
    });
    socket.on('initBananas', serverBananas => serverBananas.forEach(b => spawnBananaMesh(b.id, b.x, b.z)));

    socket.on('startCountdown', () => {
      if (!isSinglePlayer) startCountdownLocal();
    });

    // 描画ループ
    let lastCalculatedRank = 1;
    function animate() {
      requestAnimationFrame(animate);

      frameCount++;
      const now = performance.now();
      if (now >= lastTime + 1000) {
        fpsElem.innerText = `FPS: ${Math.round((frameCount * 1000) / (now - lastTime))}`;
        frameCount = 0;
        lastTime = now;
      }

      if (isSinglePlayer && canControl) {
        aiCars.forEach(ai => {
          const prevProg = ai.progress;
          ai.progress = (ai.progress + ai.speed) % 1.0;
          if (ai.progress < prevProg) ai.lap++;

          const centerPos = curve.getPoint(ai.progress);
          const tangent = curve.getTangent(ai.progress).normalize();
          const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
          
          const finalPos = centerPos.clone().add(normal.clone().multiplyScalar(ai.laneOffset));
          finalPos.y *= 0.05;

          ai.mesh.position.copy(finalPos);
          ai.mesh.rotation.y = Math.atan2(tangent.x, tangent.z);
        });
      }

      itemBoxes.forEach(b => {
        if (b.active) b.mesh.rotation.y += 0.03;
        else if (--b.respawnTimer <= 0) { b.active = true; b.mesh.visible = true; }
      });

      // 操作入力＆位置更新
      if (canControl && localPlayerMesh) {
        if (myData.spinTimer > 0 && !isGodMode) {
          myData.spinTimer--; myData.rotY += 0.3; myData.speed *= 0.8;
        } else {
          const myPos = new THREE.Vector3(myData.x, 0, myData.z);
          let minDist = 999;
          let nearestPoint = null;
          let nearestNormal = null;
          let nearestT = 0;

          for (let i = 0; i <= 200; i++) {
            const t = i / 200;
            const pt = curve.getPoint(t);
            const d = myPos.distanceTo(new THREE.Vector3(pt.x, 0, pt.z));
            if (d < minDist) {
              minDist = d;
              nearestPoint = pt;
              nearestT = t;
              const tan = curve.getTangent(t);
              nearestNormal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
            }
          }
          myData.trackProgress = nearestT;

          let currentMaxSpeed = isGodMode ? myData.maxSpeed * 2.5 : myData.maxSpeed;
          let currentAccel = isGodMode ? myData.accel * 3 : myData.accel;

          if (minDist > trackRadius - 0.5) {
            if (!isGodMode) {
              document.getElementById('offroad-warning').style.display = 'block';
              myData.speed *= 0.6;

              if (nearestPoint && nearestNormal) {
                const toCenter = new THREE.Vector3(nearestPoint.x, 0, nearestPoint.z).sub(myPos).normalize();
                myData.x += toCenter.x * 0.4;
                myData.z += toCenter.z * 0.4;
              }
            }
          } else {
            document.getElementById('offroad-warning').style.display = 'none';
          }

          if (myData.boostTimer > 0) {
            myData.boostTimer--; currentMaxSpeed = myData.maxSpeed * 2.2;
          }

          if (keys['w'] || keys['arrowup']) myData.speed = Math.min(myData.speed + currentAccel * 2, currentMaxSpeed);
          else if (keys['s'] || keys['arrowdown']) myData.speed = Math.max(myData.speed - currentAccel, -currentMaxSpeed * 0.4);
          else if (myData.boostTimer <= 0) myData.speed *= 0.96;

          const isSteeringLeft = keys['a'] || keys['arrowleft'];
          const isSteeringRight = keys['d'] || keys['arrowright'];

          if (keys['shift'] && (isSteeringLeft || isSteeringRight) && Math.abs(myData.speed) > 0.3) {
            myData.isDrifting = true; myData.driftDir = isSteeringLeft ? 1 : -1; myData.driftCharge++;
            document.getElementById('drift-status').style.display = 'block';
            createSmoke(myData.x, myData.z);
          }

          const turnMult = myData.isDrifting ? 1.6 : 1.0;
          if (isSteeringLeft) myData.rotY += myData.turnSpeed * (myData.speed / myData.maxSpeed) * turnMult;
          if (isSteeringRight) myData.rotY -= myData.turnSpeed * (myData.speed / myData.maxSpeed) * turnMult;
        }

        myData.x += Math.sin(myData.rotY) * myData.speed;
        myData.z += Math.cos(myData.rotY) * myData.speed;

        localPlayerMesh.position.set(myData.x, 0.0, myData.z);
        localPlayerMesh.rotation.y = myData.rotY + (myData.isDrifting ? myData.driftDir * 0.3 : 0);

        itemBoxes.forEach(b => {
          if (b.active && Math.hypot(myData.x - b.mesh.position.x, myData.z - b.mesh.position.z) < 3.5) {
            b.active = false; b.mesh.visible = false; b.respawnTimer = 300;
            if (!myData.currentItem) {
              const items = ['boost', 'banana'];
              myData.currentItem = items[Math.floor(Math.random() * items.length)];
              document.getElementById('item-stock').innerText = `ITEM: ${myData.currentItem === 'boost' ? '🚀 ダッシュ' : '🍌 バナナ'} [Eキーで使用]`;
            }
          }
        });

        bananas.forEach(b => {
          if (Math.hypot(myData.x - b.mesh.position.x, myData.z - b.mesh.position.z) < 2.2) {
            if (!isGodMode) {
              myData.spinTimer = 30; 
            }
            socket.emit('remove_banana', b.id);
          }
        });

        // ★ 中間チェックポイント通過判定
        const midPt = curve.getPoint(0.5);
        if (Math.hypot(myData.x - midPt.x, myData.z - midPt.z) < 25 && !myData.hasPassedCP) {
          myData.hasPassedCP = true;
          document.getElementById('checkpoint-msg').innerText = "OK! ゴールを目指せ！";
        }

        // ★ ゴール通過判定 (スタート地点周辺)
        const startPt = curve.getPoint(0.01);
        if (myData.hasPassedCP && Math.hypot(myData.x - startPt.x, myData.z - startPt.z) < 25) {
          myData.hasPassedCP = false; myData.lap++;
          document.getElementById('lap-display').innerText = Math.min(myData.lap, 3);
          document.getElementById('checkpoint-msg').innerText = "NEXT: 中間チェックポイントを目指せ";
          if (myData.lap > 3) { 
            canControl = false; 
            document.getElementById('goal-banner').style.display = 'block'; 
            document.getElementById('final-rank').innerText = `RESULT: ${lastCalculatedRank} Place!`;
          }
        }

        if (!isSinglePlayer) {
          socket.emit('playerTransform', { x: myData.x, y: 0.0, z: myData.z, rotY: myData.rotY });
        }
        document.getElementById('speedometer').innerText = `${Math.round(Math.abs(myData.speed) * 180)} km/h`;
      }

      // 順位リアルタイム判定
      if (canControl) {
        const competitors = [];
        const playerTotalScore = (myData.lap - 1) + myData.trackProgress;
        competitors.push({ id: 'player', score: playerTotalScore });

        if (isSinglePlayer) {
          aiCars.forEach((ai, idx) => {
            const aiScore = (ai.lap - 1) + ai.progress;
            competitors.push({ id: `ai_${idx}`, score: aiScore });
          });
        }

        competitors.sort((a, b) => b.score - a.score);
        const myRank = competitors.findIndex(c => c.id === 'player') + 1;
        lastCalculatedRank = myRank;

        const rankSuffixes = ['st', 'nd', 'rd', 'th'];
        const suffix = rankSuffixes[Math.min(myRank - 1, 3)];
        
        document.getElementById('rank-display').innerHTML = `${myRank}${suffix} <span style="font-size: 20px; color: #bbb;">/ ${competitors.length}</span>`;
      }

      // カメラ追従処理
      if (localPlayerMesh) {
        const relativeOffset = new THREE.Vector3(0, 4.5, -14);
        relativeOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), myData.rotY);
        
        camera.position.copy(localPlayerMesh.position).add(relativeOffset);

        const targetOffset = new THREE.Vector3(0, 1.2, 6);
        targetOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), myData.rotY);
        const lookAtTarget = localPlayerMesh.position.clone().add(targetOffset);

        camera.lookAt(lookAtTarget);
      }

      // 他プレイヤーネームタグ
      Object.keys(otherPlayers).forEach(id => {
        if (nametags[id]) {
          const pMesh = otherPlayers[id];
          const tempV = new THREE.Vector3().copy(pMesh.position);
          tempV.y += 2.2;

          tempV.project(camera);

          if (tempV.z < 1.0 && tempV.x >= -1 && tempV.x <= 1 && tempV.y >= -1 && tempV.y <= 1) {
            const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(tempV.y * 0.5) + 0.5) * window.innerHeight;

            nametags[id].style.left = `${x}px`;
            nametags[id].style.top = `${y}px`;
            nametags[id].style.display = 'block';
          } else {
            nametags[id].style.display = 'none';
          }
        }
      });

      smokes.forEach((s, idx) => {
        s.position.y += 0.05; s.material.opacity -= 0.03;
        if (s.material.opacity <= 0) { scene.remove(s); smokes.splice(idx, 1); }
      });

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
