<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Multi-Racing Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
    }
    #speedometer {
      font-size: 28px;
      color: #00ffcc;
    }
    #status-msg {
      font-size: 20px;
      color: #ffcc00;
      margin-top: 5px;
    }
    #checkpoint-msg {
      font-size: 16px;
      color: #00ff66;
    }
    #item-stock {
      font-size: 20px;
      color: #ff00ea;
      margin-top: 5px;
    }
    #offroad-warning {
      color: #ff3333;
      font-size: 18px;
      display: none;
    }
    #admin-link {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 30;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #555;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s;
    }
    #admin-link:hover {
      background: #ff0055;
    }
    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px;
      font-weight: 900;
      color: #ff0055;
      text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
      display: none;
      z-index: 20;
    }
    #goal-banner {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 72px;
      font-weight: 900;
      color: #ffea00;
      text-shadow: 0 0 30px #ffea00, 4px 4px 0px #000;
      display: none;
      text-align: center;
      z-index: 20;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <a id="admin-link" href="/admin.html" target="_blank">⚙️ 管理者画面を開く</a>

  <div id="ui-container">
    <div>LAP: <span id="lap-display">1</span> / 3</div>
    <div id="speedometer">0 km/h</div>
    <div id="checkpoint-msg">NEXT: 中間チェックポイントを目指せ</div>
    <div id="item-stock">ITEM: なし [Spaceで使用]</div>
    <div id="offroad-warning">⚠️ 芝生（減速中）</div>
    <div id="status-msg">管理者のスタート待機中...</div>
    <div id="god-mode" style="color: #ffea00; display: none;">★ GOD MODE ENABLED ★</div>
  </div>

  <div id="countdown">3</div>
  <div id="goal-banner">GOAL!!</div>

  <script>
    const socket = io();

    // 1. Scene & Setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xff7744, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffaa44, 1.2);
    dirLight.position.set(100, 150, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Sky
    const skyGeo = new THREE.SphereGeometry(500, 32, 15);
    const skyMat = new THREE.MeshBasicMaterial({ color: 0xff5533, side: THREE.BackSide });
    const skyMesh = new THREE.Mesh(skyGeo, skyMat);
    scene.add(skyMesh);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(1000, 1000);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x113311, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- コース作成 (CatmullRomCurve3) ---
    const coursePoints = [
      new THREE.Vector3(0, 0, -20),
      new THREE.Vector3(0, 0, 100),
      new THREE.Vector3(120, 0, 160),
      new THREE.Vector3(180, 5, -50),
      new THREE.Vector3(80, 0, -220),
      new THREE.Vector3(-80, -5, -200),
      new THREE.Vector3(-140, 0, -80),
      new THREE.Vector3(-80, 0, -40)
    ];
    const curve = new THREE.CatmullRomCurve3(coursePoints, true);
    const trackGeo = new THREE.TubeGeometry(curve, 200, 12, 16, true);
    const trackMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8 });
    const trackMesh = new THREE.Mesh(trackGeo, trackMat);
    trackMesh.scale.y = 0.05;
    trackMesh.receiveShadow = true;
    scene.add(trackMesh);

    // --- ゴールゲート & チェッカーライン ---
    function createFinishLine() {
      const group = new THREE.Group();
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,128,128);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0,0,64,64); ctx.fillRect(64,64,64,64);
      const checkerTex = new THREE.CanvasTexture(canvas);
      checkerTex.wrapS = THREE.RepeatWrapping;
      checkerTex.wrapT = THREE.RepeatWrapping;
      checkerTex.repeat.set(4, 1);

      const lineGeo = new THREE.PlaneGeometry(24, 6);
      const lineMat = new THREE.MeshStandardMaterial({ map: checkerTex });
      const lineMesh = new THREE.Mesh(lineGeo, lineMat);
      lineMesh.rotation.x = -Math.PI / 2;
      lineMesh.position.y = 0.02;
      group.add(lineMesh);

      const pillarGeo = new THREE.BoxGeometry(1, 10, 1);
      const pillarMat = new THREE.MeshStandardMaterial({ color: 0xff0055 });
      const p1 = new THREE.Mesh(pillarGeo, pillarMat); p1.position.set(-12, 5, 0);
      const p2 = new THREE.Mesh(pillarGeo, pillarMat); p2.position.set(12, 5, 0);
      group.add(p1); group.add(p2);

      const archGeo = new THREE.BoxGeometry(25, 3, 1);
      const archMat = new THREE.MeshStandardMaterial({ map: checkerTex });
      const arch = new THREE.Mesh(archGeo, archMat);
      arch.position.set(0, 10, 0);
      group.add(arch);

      group.position.set(0, 0, 40);
      scene.add(group);
    }
    createFinishLine();

    // 中間チェックポイント
    const cpGeo = new THREE.TorusGeometry(12, 0.6, 8, 24);
    const cpMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
    const checkpointMesh = new THREE.Mesh(cpGeo, cpMat);
    checkpointMesh.position.set(80, 5, -220);
    scene.add(checkpointMesh);

    // --- アイテムボックスの設置 ---
    const itemBoxes = [];
    const itemBoxPositions = [
      new THREE.Vector3(0, 1.5, 70),
      new THREE.Vector3(130, 1.5, 60),
      new THREE.Vector3(0, 1.5, -210),
      new THREE.Vector3(-120, 1.5, -70)
    ];

    itemBoxPositions.forEach((pos) => {
      const boxGeo = new THREE.BoxGeometry(2, 2, 2);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0xffea00, metalness: 0.8, roughness: 0.2 });
      const box = new THREE.Mesh(boxGeo, boxMat);
      box.position.copy(pos);
      scene.add(box);
      itemBoxes.push({ mesh: box, active: true, respawnTimer: 0 });
    });

    // 妨害バナナ（障害物）のリスト
    const bananas = [];
    function spawnBanana(x, z) {
      const bGeo = new THREE.CylinderGeometry(0.8, 1.2, 0.4, 8);
      const bMat = new THREE.MeshStandardMaterial({ color: 0xffff00 });
      const banana = new THREE.Mesh(bGeo, bMat);
      banana.position.set(x, 0.2, z);
      scene.add(banana);
      bananas.push(banana);
    }

    // --- 車両メッシュ生成 ---
    function createCarMesh(colorHex) {
      const carGroup = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: parseInt(colorHex.replace('#', '0x')), metalness: 0.5, roughness: 0.2 });
      
      const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 4), bodyMat);
      body.position.y = 0.5;
      carGroup.add(body);
      
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2), roofMat);
      roof.position.set(0, 1.1, -0.3);
      carGroup.add(roof);

      const lightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
      const lightMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      const hl1 = new THREE.Mesh(lightGeo, lightMat); hl1.position.set(-0.7, 0.5, 2.01);
      const hl2 = new THREE.Mesh(lightGeo, lightMat); hl2.position.set(0.7, 0.5, 2.01);
      carGroup.add(hl1); carGroup.add(hl2);

      return carGroup;
    }

    // プレイヤー状態
    const otherPlayers = {};
    let localPlayerMesh = null;
    let canControl = false;
    
    let myData = { 
      x: 0, y: 0, z: 0, 
      rotY: 0, 
      speed: 0, maxSpeed: 0.8, accel: 0.02, 
      lap: 1, 
      hasPassedCP: false,
      currentItem: null, // 持っているアイテム ('boost' または 'banana')
      spinTimer: 0        // スピン（妨害ヒット）タイマー
    };
    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.code === 'Space') useItem();
    });
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    // アイテム使用関数
    function useItem() {
      if (!myData.currentItem || myData.spinTimer > 0) return;

      if (myData.currentItem === 'boost') {
        // 加速アイテム（ダッシュ）
        myData.speed = myData.maxSpeed * 1.8;
      } else if (myData.currentItem === 'banana') {
        // 妨害アイテム（自分の真裏にバナナ設置）
        const backX = myData.x - Math.sin(myData.rotY) * 4;
        const backZ = myData.z - Math.cos(myData.rotY) * 4;
        spawnBanana(backX, backZ);
      }

      myData.currentItem = null;
      document.getElementById('item-stock').innerText = "ITEM: なし [Spaceで使用]";
    }

    // 花火エフェクト
    const fireworks = [];
    function triggerFireworks() {
      document.getElementById('goal-banner').style.display = 'block';
      for (let i = 0; i < 150; i++) {
        const pGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const pMat = new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff });
        const p = new THREE.Mesh(pGeo, pMat);
        p.position.set((Math.random() - 0.5) * 20, 5 + Math.random() * 10, 40 + (Math.random() - 0.5) * 20);
        p.userData = { vx: (Math.random() - 0.5) * 0.8, vy: Math.random() * 0.8 + 0.2, vz: (Math.random() - 0.5) * 0.8 };
        scene.add(p);
        fireworks.push(p);
      }
    }

    // Socket.io 通信処理
    socket.on('updatePlayers', (players) => {
      Object.keys(players).forEach(id => {
        if (id === socket.id) {
          if (!localPlayerMesh) {
            localPlayerMesh = createCarMesh(players[id].color);
            scene.add(localPlayerMesh);
          }
          if (players[id].isGod) {
            myData.maxSpeed = 2.5;
            myData.accel = 0.1;
            document.getElementById('god-mode').style.display = 'block';
          } else {
            myData.maxSpeed = 0.8;
            myData.accel = 0.02;
            document.getElementById('god-mode').style.display = 'none';
          }
        } else {
          if (!otherPlayers[id]) {
            otherPlayers[id] = createCarMesh(players[id].color);
            scene.add(otherPlayers[id]);
          }
          otherPlayers[id].position.set(players[id].x, players[id].y, players[id].z);
          otherPlayers[id].rotation.y = players[id].rotY;
        }
      });
    });

    socket.on('playerMoved', (data) => {
      if (otherPlayers[data.id]) {
        otherPlayers[data.id].position.set(data.x, data.y, data.z);
        otherPlayers[data.id].rotation.y = data.rotY;
      }
    });

    socket.on('playerLeft', (id) => {
      if (otherPlayers[id]) {
        scene.remove(otherPlayers[id]);
        delete otherPlayers[id];
      }
    });

    socket.on('startCountdown', () => {
      let count = 3;
      canControl = false;
      myData.speed = 0;

      const statusElem = document.getElementById('status-msg');
      const cdElem = document.getElementById('countdown');
      statusElem.style.display = 'none';
      cdElem.style.display = 'block';
      cdElem.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          cdElem.innerText = count;
        } else if (count === 0) {
          cdElem.innerText = "GO!!";
          canControl = true;
        } else {
          cdElem.style.display = 'none';
          clearInterval(timer);
        }
      }, 1000);
    });

    socket.on('updateEnvironment', (env) => {
      if (env.skyType === 'sunset') {
        skyMat.color.setHex(0xff5533);
        scene.fog.color.setHex(0xff7744);
      } else if (env.skyType === 'night') {
        skyMat.color.setHex(0x050515);
        scene.fog.color.setHex(0x050515);
      }
    });

    // --- メイン描画・更新ループ ---
    function animate() {
      requestAnimationFrame(animate);

      // アイテムボックスの回転と復活タイマー
      itemBoxes.forEach(b => {
        if (b.active) {
          b.mesh.rotation.y += 0.03;
        } else {
          b.respawnTimer--;
          if (b.respawnTimer <= 0) {
            b.active = true;
            b.mesh.visible = true;
          }
        }
      });

      if (canControl && localPlayerMesh) {
        
        // スピン妨害（バナナに当たった場合）の処理
        if (myData.spinTimer > 0) {
          myData.spinTimer--;
          myData.rotY += 0.3; // クラッシュ演出（高速スピン）
          myData.speed *= 0.8;
        } else {
          // --- 道路判定（オンロード / オフロード減速） ---
          const myPos = new THREE.Vector3(myData.x, 0, myData.z);
          // 曲線上の最寄りの点を取得
          const closestPoint = curve.getPointAt(curve.getUtoTmapping(0, 0));
          
          // サンプル点から最も近いコース上の距離を計算
          let minDist = 999;
          for (let i = 0; i <= 100; i++) {
            const p = curve.getPoint(i / 100);
            const d = myPos.distanceTo(p);
            if (d < minDist) minDist = d;
          }

          // コース幅（チューブ半径 12 相当）を超えると減速
          let currentMaxSpeed = myData.maxSpeed;
          if (minDist > 14) {
            currentMaxSpeed = myData.maxSpeed * 0.35; // 道路外で速度を最大約1/3に低下
            document.getElementById('offroad-warning').style.display = 'block';
          } else {
            document.getElementById('offroad-warning').style.display = 'none';
          }

          // アクセル・ブレーキ
          if (keys['w'] || keys['arrowup']) myData.speed = Math.min(myData.speed + myData.accel, currentMaxSpeed);
          else if (keys['s'] || keys['arrowdown']) myData.speed = Math.max(myData.speed - myData.accel, -currentMaxSpeed * 0.4);
          else myData.speed *= 0.96;

          // ハンドル操作
          if (keys['a'] || keys['arrowleft']) myData.rotY += 0.04 * (myData.speed / myData.maxSpeed);
          if (keys['d'] || keys['arrowright']) myData.rotY -= 0.04 * (myData.speed / myData.maxSpeed);
        }

        // 位置の更新
        myData.x += Math.sin(myData.rotY) * myData.speed;
        myData.z += Math.cos(myData.rotY) * myData.speed;

        localPlayerMesh.position.set(myData.x, myData.y, myData.z);
        localPlayerMesh.rotation.y = myData.rotY;

        // --- アイテムボックス取得判定 ---
        itemBoxes.forEach(b => {
          if (b.active && Math.hypot(myData.x - b.mesh.position.x, myData.z - b.mesh.position.z) < 3.5) {
            b.active = false;
            b.mesh.visible = false;
            b.respawnTimer = 300; // 5秒後に復活

            if (!myData.currentItem) {
              const items = ['boost', 'banana'];
              myData.currentItem = items[Math.floor(Math.random() * items.length)];
              const name = myData.currentItem === 'boost' ? '🚀 ダッシュキノコ' : '🍌 バナナ罠';
              document.getElementById('item-stock').innerText = `ITEM: ${name} [Spaceで使用]`;
            }
          }
        });

        // --- 妨害バナナ判定 ---
        bananas.forEach((b, idx) => {
          if (Math.hypot(myData.x - b.position.x, myData.z - b.position.z) < 2.2) {
            myData.spinTimer = 30; // 約0.5秒スピン＆失速
            scene.remove(b);
            bananas.splice(idx, 1);
          }
        });

        // --- ラップ & チェックポイント判定 ---
        const distCP = Math.hypot(myData.x - 80, myData.z - (-220));
        if (distCP < 25 && !myData.hasPassedCP) {
          myData.hasPassedCP = true;
          document.getElementById('checkpoint-msg').innerText = "OK! ゴールゲートを目指せ！";
          document.getElementById('checkpoint-msg').style.color = "#ffea00";
        }

        if (myData.hasPassedCP && Math.abs(myData.x) < 12 && Math.abs(myData.z - 40) < 4) {
          myData.hasPassedCP = false;
          myData.lap++;
          document.getElementById('lap-display').innerText = Math.min(myData.lap, 3);
          document.getElementById('checkpoint-msg').innerText = "NEXT: 中間チェックポイントを目指せ";
          document.getElementById('checkpoint-msg').style.color = "#00ff66";

          if (myData.lap > 3) {
            canControl = false;
            triggerFireworks();
          }
        }

        socket.emit('playerTransform', { x: myData.x, y: myData.y, z: myData.z, rotY: myData.rotY });
        document.getElementById('speedometer').innerText = `${Math.round(Math.abs(myData.speed) * 180)} km/h`;
      }

      // カメラ追従
      if (localPlayerMesh) {
        const camOffset = new THREE.Vector3(0, 4, -12).applyAxisAngle(new THREE.Vector3(0, 1, 0), myData.rotY);
        camera.position.copy(localPlayerMesh.position).add(camOffset);
        camera.lookAt(localPlayerMesh.position.clone().add(new THREE.Vector3(0, 1.5, 10).applyAxisAngle(new THREE.Vector3(0, 1, 0), myData.rotY)));
      }

      // 花火
      fireworks.forEach((p, idx) => {
        p.position.x += p.userData.vx;
        p.position.y += p.userData.vy;
        p.position.z += p.userData.vz;
        p.userData.vy -= 0.02;
        if (p.position.y < 0) {
          scene.remove(p);
          fireworks.splice(idx, 1);
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
