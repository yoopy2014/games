<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Online Racing with Admin Start</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; font-family: -apple-system, sans-serif; background: #000; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
    
    /* UIオーバーレイ */
    #ui { position: absolute; top: 15px; left: 15px; color: #fff; z-index: 10; font-weight: bold; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px; }
    #leaderboard { position: absolute; top: 15px; right: 15px; color: #fff; z-index: 10; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px; min-width: 160px; }
    
    /* カウントダウン表示 */
    #countdown-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 25; color: #ffd700; font-size: 96px; font-weight: 900;
      text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 40px rgba(255,215,0,0.6);
      pointer-events: none; text-align: center;
    }
    #status-msg { font-size: 24px; color: #fff; font-weight: bold; margin-top: 10px; }

    /* 管理者パネルボタン */
    #admin-toggle { position: absolute; bottom: 15px; right: 15px; z-index: 20; background: #e63946; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    /* 管理者パネル modal */
    #admin-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30; background: #222; color: #fff; padding: 20px; border-radius: 12px; width: 340px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    #admin-modal input { width: 100%; padding: 8px; margin: 10px 0; background: #333; border: 1px solid #555; color: #fff; border-radius: 4px; }
    .btn { background: #e63946; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 5px; width: 100%; font-weight: bold; }
    .btn-start { background: #2a9d8f; font-size: 16px; padding: 12px; margin-bottom: 12px; }
    .p-card { background: #333; padding: 8px; margin-top: 8px; border-radius: 6px; font-size: 12px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div id="speed">Speed: 0 km/h</div>
    <div id="lap">Lap: 1 / 3</div>
  </div>

  <div id="leaderboard">
    🎯 順位表
    <div id="rank-list"></div>
  </div>

  <!-- カウントダウン ＆ 状態メッセージ -->
  <div id="countdown-overlay">
    <div id="count-num"></div>
    <div id="status-msg">管理者のスタート指示を待っています...</div>
  </div>

  <button id="admin-toggle" onclick="toggleAdmin()">管理者パネル</button>

  <div id="admin-modal">
    <h3>管理者制御</h3>
    <input type="password" id="admin-pass" placeholder="パスワード (admin123)">
    
    <button class="btn btn-start" onclick="startRace()">🏁 レースを一斉スタート</button>
    
    <h4>プレイヤー一覧</h4>
    <div id="player-list"></div>
    <button onclick="toggleAdmin()" style="margin-top:15px; background:#555;" class="btn">閉じる</button>
  </div>

<script>
  const socket = io();

  // 1. Three.js セットアップ
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa0a0a0);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // 照明
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(100, 200, 100);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x666666));

  // コース
  const groundGeo = new THREE.PlaneGeometry(300, 300);
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const trackGeo = new THREE.RingGeometry(60, 100, 64);
  const trackMat = new THREE.MeshLambertMaterial({ color: 0x333333, side: THREE.DoubleSide });
  const track = new THREE.Mesh(trackGeo, trackMat);
  track.rotation.x = -Math.PI / 2;
  track.position.y = 0.01;
  scene.add(track);

  // スタートライン
  const lineGeo = new THREE.PlaneGeometry(40, 4);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const startLine = new THREE.Mesh(lineGeo, lineMat);
  startLine.rotation.x = -Math.PI / 2;
  startLine.position.set(80, 0.02, 0);
  scene.add(startLine);

  function createCarMesh(color, isGod) {
    const group = new THREE.Group();
    const bodyGeo = new THREE.BoxGeometry(2, 1, 4);
    const bodyMat = new THREE.MeshStandardMaterial({ 
      color: color,
      emissive: isGod ? 0xffd700 : 0x000000,
      emissiveIntensity: isGod ? 0.8 : 0
    });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.5;
    group.add(body);
    return group;
  }

  // ステータス管理
  let myId = null;
  let raceStarted = false; // スタート判定フラグ
  const myCar = createCarMesh(0xff0000, false);
  scene.add(myCar);

  const carState = {
    x: 80,
    z: 0,
    rotY: 0,
    speed: 0,
    maxSpeed: 1.2,
    accel: 0.03,
    isGod: false,
    lap: 1,
    passedCP: false
  };

  const otherCars = {};

  // キーボード操作
  const keys = { up: false, down: false, left: false, right: false };
  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.up = true;
    if (['ArrowDown', 's', 'S'].includes(e.key)) keys.down = true;
    if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
    if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
  });
  window.addEventListener('keyup', e => {
    if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.up = false;
    if (['ArrowDown', 's', 'S'].includes(e.key)) keys.down = false;
    if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
    if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
  });

  socket.on('connect', () => { myId = socket.id; });

  // プレイヤー同期
  socket.on('updatePlayers', (players) => {
    const pList = document.getElementById('player-list');
    const rList = document.getElementById('rank-list');
    pList.innerHTML = '';
    rList.innerHTML = '';

    Object.keys(players).forEach(id => {
      const p = players[id];

      if (id === myId) {
        if (p.isGod && !carState.isGod) {
          carState.isGod = true;
          carState.maxSpeed = 3.5;
          carState.accel = 0.15;
        }
      } else {
        if (!otherCars[id]) {
          otherCars[id] = createCarMesh(p.color || 0x0000ff, p.isGod);
          scene.add(otherCars[id]);
        }
      }

      pList.innerHTML += `
        <div class="p-card">
          ID: ${id.slice(0, 5)}... ${p.isGod ? '<b>[最強]</b>' : ''}<br>
          <button class="btn" onclick="makeGod('${id}')">最強にする</button>
        </div>`;

      rList.innerHTML += `<div>${id === myId ? '★自分' : '他車'}: Lap ${p.lap || 1}</div>`;
    });

    Object.keys(otherCars).forEach(id => {
      if (!players[id]) {
        scene.remove(otherCars[id]);
        delete otherCars[id];
      }
    });
  });

  socket.on('playerMoved', (data) => {
    if (otherCars[data.id]) {
      otherCars[data.id].position.set(data.x, 0, data.z);
      otherCars[data.id].rotation.y = data.rotY;
    }
  });

  // 管理者からのカウントダウン開始命令を受信
  socket.on('startCountdown', () => {
    const numEl = document.getElementById('count-num');
    const msgEl = document.getElementById('status-msg');
    
    // 位置リセット
    carState.x = 80;
    carState.z = 0;
    carState.rotY = 0;
    carState.speed = 0;
    raceStarted = false;

    msgEl.innerText = "";
    let count = 3;
    numEl.innerText = count;

    const timer = setInterval(() => {
      count--;
      if (count > 0) {
        numEl.innerText = count;
      } else if (count === 0) {
        numEl.innerText = "GO!";
        raceStarted = true; // 操作解禁
      } else {
        numEl.innerText = "";
        clearInterval(timer);
      }
    }, 1000);
  });

  // メインループ
  function animate() {
    requestAnimationFrame(animate);

    // レーススタート後のみ操作可能
    if (raceStarted) {
      if (keys.up) carState.speed = Math.min(carState.maxSpeed, carState.speed + carState.accel);
      else if (keys.down) carState.speed = Math.max(-carState.maxSpeed / 2, carState.speed - carState.accel);
      else carState.speed *= 0.95;

      if (Math.abs(carState.speed) > 0.05) {
        const dir = carState.speed > 0 ? 1 : -1;
        if (keys.left) carState.rotY += 0.04 * dir;
        if (keys.right) carState.rotY -= 0.04 * dir;
      }

      carState.x += Math.sin(carState.rotY) * carState.speed;
      carState.z += Math.cos(carState.rotY) * carState.speed;
    } else {
      carState.speed = 0; // 開始前は強制停止
    }

    myCar.position.set(carState.x, 0, carState.z);
    myCar.rotation.y = carState.rotY;

    // 周回判定
    if (carState.z < -70) carState.passedCP = true;
    if (carState.z > 70 && carState.passedCP) {
      carState.lap++;
      carState.passedCP = false;
      document.getElementById('lap').innerText = `Lap: ${carState.lap} / 3`;
    }

    // カメラ追従
    const camOffset = new THREE.Vector3(
      carState.x - Math.sin(carState.rotY) * 15,
      8,
      carState.z - Math.cos(carState.rotY) * 15
    );
    camera.position.lerp(camOffset, 0.1);
    camera.lookAt(carState.x, 2, carState.z);

    document.getElementById('speed').innerText = `Speed: ${Math.round(Math.abs(carState.speed) * 100)} km/h`;

    if (Math.abs(carState.speed) > 0.01 || raceStarted) {
      socket.emit('playerTransform', {
        x: carState.x,
        z: carState.z,
        rotY: carState.rotY,
        lap: carState.lap
      });
    }

    renderer.render(scene, camera);
  }

  animate();

  // 管理者操作
  function toggleAdmin() {
    const modal = document.getElementById('admin-modal');
    modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
  }

  function startRace() {
    const pass = document.getElementById('admin-pass').value;
    socket.emit('admin_start_race', { pass });
    toggleAdmin();
  }

  function makeGod(targetId) {
    const pass = document.getElementById('admin-pass').value;
    socket.emit('admin_make_god', { pass, targetId });
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
